version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  backend:
    build: ./backend
    ports: ["5050:5050"]
    environment:
      MONGO_URI: mongodb://mongo:27017/edupulse
      JWT_SECRET: change-me-in-production-32bytes-minimum-please
      WELLBEING_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GEMINI_MODEL: gemini-2.5-flash
    depends_on: [mongo]
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run build && npx vite preview --host --port 5173"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongo_data:
